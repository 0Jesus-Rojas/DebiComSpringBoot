
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso denegado | DebiCom</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-dark text-white min-vh-100">

<!-- CONTENEDOR PRINCIPAL -->
<div class="container-fluid p-0">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}">
    </div>

    <!-- CONTENIDO -->
    <main class="container-fluid px-3 px-md-4 px-xl-5 py-4">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8 col-xl-7">

                <!-- TARJETA DE ACCESO DENEGADO -->
                <div class="card bg-secondary bg-opacity-10
                                border border-secondary shadow-lg
                                rounded-4">

                    <div class="card-body p-4 p-md-5 text-center">

                        <!-- ICONO -->
                        <div class="d-flex justify-content-center mb-4">

                            <div class="rounded-circle bg-danger bg-opacity-25
                                            d-flex align-items-center justify-content-center"
                                 style="width: 90px; height: 90px;">

                                    <span class="text-danger fw-bold"
                                          style="font-size: 3rem;">

                                        !

                                    </span>

                            </div>

                        </div>


                        <!-- TÍTULO -->
                        <h1 class="h2 fw-bold mb-3">

                            Acceso no disponible

                        </h1>


                        <!-- MENSAJE DINÁMICO -->
                        <p class="text-white-50 fs-6 mb-4"
                           th:text="${param.motivo != null and #strings.equalsIgnoreCase(param.motivo[0], 'sin-rol') ?
                               'Tu usuario está autenticado, pero todavía no tiene un rol asignado.' :
                               (param.motivo != null and #strings.equalsIgnoreCase(param.motivo[0], 'rol') ?
                               'Tu rol actual no tiene permisos para acceder a esta sección.' :
                               'No tienes permisos para acceder a esta sección.')}">

                            No tienes permisos para acceder a esta sección.

                        </p>


                        <!-- SEPARADOR -->
                        <hr class="border-secondary my-4">


                        <!-- BOTONES -->
                        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">

                            <a class="btn btn-primary px-4 py-2 fw-semibold"
                               th:href="@{/comprador/estado-credito}">

                                Ir al dashboard

                            </a>


                            <a class="btn btn-outline-light px-4 py-2"
                               th:href="@{/comprador/perfil}">

                                Ver mi perfil

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
