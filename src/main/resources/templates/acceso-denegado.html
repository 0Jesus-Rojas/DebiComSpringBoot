<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Acceso denegado | DebiCom</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="app-main">
        <section class="page-content container-fluid px-3 px-md-4 px-xl-5 py-3 py-lg-4">
            <article class="card mb-4">
                <h1>Acceso no disponible</h1>
                <p th:text="${param.motivo != null and #strings.equalsIgnoreCase(param.motivo[0], 'sin-rol') ? 'Tu usuario está autenticado, pero todavía no tiene un rol asignado.' : (param.motivo != null and #strings.equalsIgnoreCase(param.motivo[0], 'rol') ? 'Tu rol actual no tiene permisos para acceder a esta sección.' : 'No tienes permisos para acceder a esta sección.')}">
                    No tienes permisos para acceder a esta sección.
                </p>

                <div class="form-actions d-grid d-sm-flex flex-wrap gap-2 justify-content-sm-end mt-3">
                    <a class="button primary text-center" th:href="@{/comprador/estado-credito}">
                        Ir al dashboard
                    </a>

                    <a class="button secondary text-center" th:href="@{/comprador/perfil}">
                        Ver mi perfil
                    </a>
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
