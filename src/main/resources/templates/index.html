<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | DebiCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body th:attr="data-auth-tab=${authTab != null ? authTab : ''}, data-auth-error=${authMessage != null ? 'true' : 'false'}" class="d-flex flex-column min-vh-100">

<header class="navbar container-fluid px-3 px-md-4 py-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="brand">DebiCom</div>
    <button class="btn-open-modal" id="openModalBtn" type="button">
        Iniciar Sesion
    </button>
</header>

<main class="hero container-fluid flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center px-3 py-5">
    <h1>Bienvenido a DebiCom</h1>
    <p>Administra tus créditos, tiendas y pagos desde una sola plataforma.</p>
</main>

<!-- Modal de Autenticacion -->
<div class="modal-overlay" id="authModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-container">

        <button class="btn-close" id="closeModalBtn" type="button" aria-label="Cerrar">
            X
        </button>

        <div th:if="${authMessage != null and !#strings.isEmpty(authMessage)}"
             id="authAlert"
             class="auth-alert"
             th:classappend="${authType == 'warning'} ? ' warning' : ' error'"
             role="alert"
             aria-live="polite">
            <span class="auth-alert-icon">!</span>
            <span th:text="${authMessage}">Mensaje de alerta</span>
            <button type="button" class="auth-alert-close" aria-label="Cerrar alerta">&times;</button>
        </div>

        <div class="tab-buttons d-flex flex-wrap gap-2">
            <button class="tab-btn active" type="button" onclick="switchTab('login', this)">
                Iniciar Sesion
            </button>

            <button class="tab-btn" type="button" onclick="switchTab('register', this)">
                Registro
            </button>
        </div>

        <!-- Formulario de Login -->
        <form th:action="@{/login}" id="login" class="tab-content active w-100" method="post">

            <div class="form-group col-12">
                <label for="correo">Correo Electronico</label>
                <input
                        type="email"
                        name="correo"
                        id="correo"
                        required
                        placeholder="correo@ejemplo.com"
                        autocomplete="email" class="form-control">
            </div>

            <div class="form-group col-12">
                <label for="clave">Contrasena</label>
                <input
                        type="password"
                        name="clave"
                        id="clave"
                        required
                        placeholder="********"
                        autocomplete="current-password" class="form-control">
            </div>

            <button type="submit" class="btn-submit w-100">
                Ingresar
            </button>
        </form>

        <!-- Formulario de Registro -->
        <form th:action="@{/register}" id="register" class="tab-content w-100" method="post">

            <div class="form-grid row g-3 d-flex flex-wrap">

                <div class="form-group col-12 col-md-6">
                    <label for="reg-nombre">Nombre</label>
                    <input
                            type="text"
                            name="nombre"
                            id="reg-nombre"
                            required
                            autocomplete="given-name" class="form-control">
                </div>

                <div class="form-group col-12 col-md-6">
                    <label for="reg-apellido">Apellido</label>
                    <input
                            type="text"
                            name="apellido"
                            id="reg-apellido"
                            required
                            autocomplete="family-name" class="form-control">
                </div>

            </div>

            <div class="form-grid row g-3 d-flex flex-wrap">

                <div class="form-group col-12 col-md-6">
                    <label for="reg-tipo-id">Tipo Identificacion</label>

                    <select name="tipo_id" id="reg-tipo-id" required class="form-select">
                        <option th:each="tipo : ${tipos}"
                                th:value="${tipo.idTipoIdentificacion}"
                                th:text="${tipo.nombreTipo}">
                            Tipo
                        </option>
                    </select>
                </div>

                <div class="form-group col-12 col-md-6">
                    <label for="reg-id">N Identificacion</label>

                    <input
                            type="text"
                            name="num_id"
                            id="reg-id"
                            required class="form-control">
                </div>

            </div>

            <div class="form-grid row g-3 d-flex flex-wrap">

                <div class="form-group col-12 col-md-6">
                    <label for="reg-fecha-nac">Fecha Nacimiento</label>

                    <input
                            type="date"
                            name="fecha_nac"
                            id="reg-fecha-nac"
                            required class="form-control">
                </div>

                <div class="form-group col-12 col-md-6">
                    <label for="reg-telefono">Telefono</label>

                    <input
                            type="tel"
                            name="telefono"
                            id="reg-telefono"
                            required
                            autocomplete="tel" class="form-control">
                </div>

            </div>

            <div class="form-group col-12">
                <label for="reg-direccion">Direccion</label>

                <input
                        type="text"
                        name="direccion"
                        id="reg-direccion"
                        required class="form-control">
            </div>

            <div class="form-group col-12">
                <label for="reg-email">Correo Electronico</label>

                <input
                        type="email"
                        name="correo"
                        id="reg-email"
                        required
                        autocomplete="email" class="form-control">
            </div>

            <div class="form-group col-12">
                <label for="reg-password">Contrasena</label>

                <input
                        type="password"
                        name="clave"
                        id="reg-password"
                        required
                        autocomplete="new-password" class="form-control">
            </div>

            <div class="form-group checkbox-group col-12">

                <input
                        type="checkbox"
                        name="autoriza"
                        id="reg-autoriza"
                        value="true"
                        required class="form-check-input">

                <label for="reg-autoriza">
                    Autorizo el tratamiento de datos personales
                </label>

            </div>

            <button type="submit" class="btn-submit w-100">
                Registrarse
            </button>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script th:src="@{/js/main.js}" defer></script>


</body>
</html>
