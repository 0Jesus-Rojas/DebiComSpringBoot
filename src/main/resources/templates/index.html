
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio | DebiCom</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="min-vh-100 d-flex flex-column bg-dark text-white"
      th:attr="data-auth-tab=${authTab != null ? authTab : ''},
               data-auth-error=${authMessage != null ? 'true' : 'false'}">

<!-- HEADER -->
<header class="container-fluid px-3 px-md-5 py-3
                   d-flex justify-content-between align-items-center
                   border-bottom border-secondary">

    <a href="/" class="text-white text-decoration-none
                          fs-3 fw-bold">
        DebiCom
    </a>

    <button type="button"
            class="btn btn-primary px-3 px-md-4"
            data-bs-toggle="modal"
            data-bs-target="#authModal">

        Iniciar Sesión
    </button>

</header>


<!-- CONTENIDO PRINCIPAL -->
<main class="container-fluid flex-grow-1
                 d-flex justify-content-center align-items-center
                 text-center px-3 py-5">

    <div class="col-12 col-md-10 col-lg-8">

        <h1 class="display-4 fw-bold mb-3">
            Bienvenido a DebiCom
        </h1>

        <p class="fs-5 text-white-50 mb-4">
            Administra tus créditos, tiendas y pagos
            desde una sola plataforma.
        </p>

        <button type="button"
                class="btn btn-primary btn-lg px-4"
                data-bs-toggle="modal"
                data-bs-target="#authModal">

            Comenzar
        </button>

    </div>

</main>


<!-- MODAL DE AUTENTICACIÓN -->
<div class="modal fade"
     id="authModal"
     tabindex="-1"
     aria-labelledby="authModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered
                    modal-dialog-scrollable modal-lg">

        <div class="modal-content bg-dark text-white
                        border border-secondary">

            <!-- CABECERA MODAL -->
            <div class="modal-header border-secondary">

                <h5 class="modal-title fw-bold"
                    id="authModalLabel">

                    Bienvenido a DebiCom

                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                </button>

            </div>


            <!-- CUERPO MODAL -->
            <div class="modal-body p-3 p-md-4">

                <!-- MENSAJE DE AUTENTICACIÓN -->
                <div th:if="${authMessage != null and !#strings.isEmpty(authMessage)}"
                     id="authAlert"
                     class="alert"
                     th:classappend="${authType == 'warning'} ?
                         ' alert-warning' : ' alert-danger'"
                     role="alert">

                        <span th:text="${authMessage}">
                            Mensaje de alerta
                        </span>

                </div>


                <!-- PESTAÑAS -->
                <ul class="nav nav-pills nav-fill gap-2 mb-4"
                    id="authTabs"
                    role="tablist">

                    <li class="nav-item" role="presentation">

                        <button class="nav-link active w-100"
                                id="login-tab"
                                data-bs-toggle="pill"
                                data-bs-target="#login-pane"
                                type="button"
                                role="tab"
                                aria-controls="login-pane"
                                aria-selected="true">

                            Iniciar Sesión

                        </button>

                    </li>

                    <li class="nav-item" role="presentation">

                        <button class="nav-link w-100"
                                id="register-tab"
                                data-bs-toggle="pill"
                                data-bs-target="#register-pane"
                                type="button"
                                role="tab"
                                aria-controls="register-pane"
                                aria-selected="false">

                            Registro

                        </button>

                    </li>

                </ul>


                <!-- CONTENIDO DE LAS PESTAÑAS -->
                <div class="tab-content">

                    <!-- LOGIN -->
                    <div class="tab-pane fade show active"
                         id="login-pane"
                         role="tabpanel"
                         aria-labelledby="login-tab"
                         tabindex="0">

                        <form th:action="@{/login}"
                              id="login"
                              method="post">

                            <div class="mb-3">

                                <label for="correo"
                                       class="form-label">

                                    Correo Electrónico

                                </label>

                                <input type="email"
                                       name="correo"
                                       id="correo"
                                       class="form-control"
                                       placeholder="correo@ejemplo.com"
                                       autocomplete="email"
                                       required>

                            </div>


                            <div class="mb-4">

                                <label for="clave"
                                       class="form-label">

                                    Contraseña

                                </label>

                                <input type="password"
                                       name="clave"
                                       id="clave"
                                       class="form-control"
                                       placeholder="********"
                                       autocomplete="current-password"
                                       required>

                            </div>


                            <button type="submit"
                                    class="btn btn-primary w-100 py-2 fw-semibold">

                                Ingresar

                            </button>

                        </form>

                    </div>


                    <!-- REGISTRO -->
                    <div class="tab-pane fade"
                         id="register-pane"
                         role="tabpanel"
                         aria-labelledby="register-tab"
                         tabindex="0">

                        <form th:action="@{/register}"
                              id="register"
                              method="post">

                            <div class="row g-3">

                                <!-- NOMBRE -->
                                <div class="col-12 col-md-6">

                                    <label for="reg-nombre"
                                           class="form-label">

                                        Nombre

                                    </label>

                                    <input type="text"
                                           name="nombre"
                                           id="reg-nombre"
                                           class="form-control"
                                           autocomplete="given-name"
                                           required>

                                </div>


                                <!-- APELLIDO -->
                                <div class="col-12 col-md-6">

                                    <label for="reg-apellido"
                                           class="form-label">

                                        Apellido

                                    </label>

                                    <input type="text"
                                           name="apellido"
                                           id="reg-apellido"
                                           class="form-control"
                                           autocomplete="family-name"
                                           required>

                                </div>


                                <!-- TIPO IDENTIFICACIÓN -->
                                <div class="col-12 col-md-6">

                                    <label for="reg-tipo-id"
                                           class="form-label">

                                        Tipo de Identificación

                                    </label>

                                    <select name="tipo_id"
                                            id="reg-tipo-id"
                                            class="form-select"
                                            required>

                                        <option th:each="tipo : ${tipos}"
                                                th:value="${tipo.idTipoIdentificacion}"
                                                th:text="${tipo.nombreTipo}">

                                            Tipo

                                        </option>

                                    </select>

                                </div>


                                <!-- NÚMERO IDENTIFICACIÓN -->
                                <div class="col-12 col-md-6">

                                    <label for="reg-id"
                                           class="form-label">

                                        N.º de Identificación

                                    </label>

                                    <input type="text"
                                           name="num_id"
                                           id="reg-id"
                                           class="form-control"
                                           required>

                                </div>


                                <!-- FECHA NACIMIENTO -->
                                <div class="col-12 col-md-6">

                                    <label for="reg-fecha-nac"
                                           class="form-label">

                                        Fecha de Nacimiento

                                    </label>

                                    <input type="date"
                                           name="fecha_nac"
                                           id="reg-fecha-nac"
                                           class="form-control"
                                           required>

                                </div>


                                <!-- TELÉFONO -->
                                <div class="col-12 col-md-6">

                                    <label for="reg-telefono"
                                           class="form-label">

                                        Teléfono

                                    </label>

                                    <input type="tel"
                                           name="telefono"
                                           id="reg-telefono"
                                           class="form-control"
                                           autocomplete="tel"
                                           required>

                                </div>


                                <!-- DIRECCIÓN -->
                                <div class="col-12">

                                    <label for="reg-direccion"
                                           class="form-label">

                                        Dirección

                                    </label>

                                    <input type="text"
                                           name="direccion"
                                           id="reg-direccion"
                                           class="form-control"
                                           required>

                                </div>


                                <!-- CORREO -->
                                <div class="col-12">

                                    <label for="reg-email"
                                           class="form-label">

                                        Correo Electrónico

                                    </label>

                                    <input type="email"
                                           name="correo"
                                           id="reg-email"
                                           class="form-control"
                                           autocomplete="email"
                                           required>

                                </div>


                                <!-- CONTRASEÑA -->
                                <div class="col-12">

                                    <label for="reg-password"
                                           class="form-label">

                                        Contraseña

                                    </label>

                                    <input type="password"
                                           name="clave"
                                           id="reg-password"
                                           class="form-control"
                                           autocomplete="new-password"
                                           required>

                                </div>


                                <!-- AUTORIZACIÓN -->
                                <div class="col-12">

                                    <div class="form-check">

                                        <input type="checkbox"
                                               name="autoriza"
                                               id="reg-autoriza"
                                               value="true"
                                               class="form-check-input"
                                               required>

                                        <label for="reg-autoriza"
                                               class="form-check-label">

                                            Autorizo el tratamiento
                                            de datos personales

                                        </label>

                                    </div>

                                </div>


                                <!-- BOTÓN REGISTRO -->
                                <div class="col-12">

                                    <button type="submit"
                                            class="btn btn-primary w-100 py-2 fw-semibold">

                                        Registrarse

                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

            </div>


            <!-- PIE MODAL -->
            <div class="modal-footer border-secondary">

                <button type="button"
                        class="btn btn-outline-light"
                        data-bs-dismiss="modal">

                    Cerrar

                </button>

            </div>

        </div>

    </div>

</div>


<!-- JAVASCRIPT DE BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
