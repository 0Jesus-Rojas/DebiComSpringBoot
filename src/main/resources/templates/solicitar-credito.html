<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Solicitar crédito | DebiCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="app-main">
        <section class="page-content container-fluid px-3 px-md-4 px-xl-5 py-3 py-lg-4">
            <div class="page-heading d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div>
                    <h1>Solicitar Crédito</h1>
                    <p>Complete el formulario para solicitar un nuevo crédito.</p>
                </div>
            </div>

            <div class="card" th:if="${error != null and !#strings.isEmpty(error)}" style="margin-bottom:16px; border-left:4px solid #e74c3c;">
                <strong>Error:</strong> <span th:text="${error}">Error</span>
            </div>

            <div class="card" th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" style="margin-bottom:16px; border-left:4px solid #2ecc71;">
                <strong th:text="${mensaje}">Mensaje</strong>
                <span th:if="${idSolicitud != null}" th:text="' ID de solicitud: ' + ${idSolicitud}"></span>
            </div>

            <form class="card" th:action="@{/comprador/solicitar-credito}" method="post">
                <div class="dark-grid row g-3 d-flex flex-wrap">
                    <label class="col-12 col-md-6">Nombre completo
                        <input th:value="${session.nombre != null ? session.nombre + ' ' + session.apellido : ''}" readonly class="form-control">
                    </label>

                    <label class="col-12 col-md-6">Cliente
                        <input th:value="${idCliente != null ? idCliente : ''}" readonly class="form-control">
                    </label>

                    <label class="full col-12">Nombre de la tienda
                        <input
                                type="search"
                                id="tiendaBusqueda"
                                class="store-search form-control"
                                placeholder="Buscar por nombre o dirección..."
                                autocomplete="off"
                                aria-label="Buscar tienda">

                        <select name="idTienda" id="idTienda" required class="form-select">
                            <option value="">Seleccione una tienda</option>
                            <option th:each="tienda : ${tiendas}"
                                    th:value="${tienda.idTienda}"
                                    data-store
                                    th:text="${tienda.nombreTienda} + ' — ' + ${tienda.direccion}">
                                Tienda
                            </option>
                            <option value="" data-empty-search hidden disabled>
                                No hay tiendas que coincidan con la búsqueda
                            </option>
                        </select>
                    </label>

                    <label class="col-12 col-md-6">Monto solicitado
                        <input type="number" name="monto" min="0.01" step="0.01" placeholder="0.00" required class="form-control">
                    </label>

                    <label class="col-12 col-md-6">Plazo para pagar
                        <select name="plazo" required class="form-select">
                            <option value="15 días">15 días</option>
                            <option value="21 días">21 días</option>
                            <option value="1 mes">1 mes</option>
                        </select>
                    </label>

                    <label class="full col-12">Motivo del crédito
                        <textarea name="descripcion" maxlength="255" placeholder="Describa el motivo de su solicitud" class="form-control"></textarea>
                    </label>
                </div>

                <div class="credit-summary row g-3 d-flex flex-wrap">
                    <div class="col-12 col-md-4"><span>Estado inicial</span><b>Pendiente</b></div>
                    <div class="col-12 col-md-4"><span>Fecha de solicitud</span><b>Automática</b></div>
                    <div class="col-12 col-md-4"><span>Vencimiento</span><b>Según plazo seleccionado</b></div>
                </div>

                <div class="form-actions d-grid d-sm-flex flex-wrap gap-2 justify-content-sm-end mt-3">
                    <button class="button primary" type="submit">Enviar solicitud</button>
                    <a class="button secondary text-center" th:href="@{/comprador/perfil}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
