<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registrarse como vendedor | DebiCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="app-main">
        <section class="page-content container-fluid px-3 px-md-4 px-xl-5 py-3 py-lg-4">
            <div class="page-heading d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div>
                    <h1>Registrarse como vendedor</h1>
                    <p>Convierte tu cuenta de comprador en una cuenta de vendedor.</p>
                </div>
            </div>

            <article class="card mb-4" th:if="${error != null and !#strings.isEmpty(error)}" style="margin-bottom:16px;border-left:4px solid #e74c3c;">
                <strong>Error:</strong> <span th:text="${error}">Error</span>
            </article>

            <article class="card mb-4">
                <h2>Confirmación</h2>
                <p>Al continuar podrás crear una o varias tiendas y administrar su inventario.</p>
                <form method="post" th:action="@{/comprador/registrarse-vendedor}">
                    <div class="form-actions d-grid d-sm-flex flex-wrap gap-2 justify-content-sm-end mt-3">
                        <button class="button primary" type="submit">Confirmar registro como vendedor</button>
                        <a class="button secondary text-center" th:href="@{/comprador/perfil}">Cancelar</a>
                    </div>
                </form>
            </article>
        </section>
    </main>
</div>
</body>
</html>
