
<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registrarse como vendedor | DebiCom</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">

        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Contenido principal -->
        <main class="col-12 col-lg-9 col-xl-10">

            <section class="container-fluid px-3 px-md-4 px-xl-5 py-4">

                <!-- Encabezado -->
                <div class="mb-4">
                    <h1 class="h3 fw-bold mb-2">
                        Registrarse como vendedor
                    </h1>

                    <p class="text-secondary mb-0">
                        Convierte tu cuenta de comprador en una cuenta de vendedor.
                    </p>
                </div>

                <!-- Mensaje de error -->
                <div class="alert alert-danger mb-4"
                     role="alert"
                     th:if="${error != null and !#strings.isEmpty(error)}">

                    <strong>Error:</strong>
                    <span th:text="${error}">
                        Error
                    </span>

                </div>

                <!-- Confirmación de registro -->
                <article class="card border-0 shadow-sm mb-4">

                    <div class="card-body p-3 p-md-4">

                        <div class="d-flex align-items-start gap-3 mb-4">

                            <!-- Icono informativo -->
                            <div class="rounded-circle bg-primary-subtle
                                        text-primary p-3 flex-shrink-0">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     width="26"
                                     height="26"
                                     fill="currentColor"
                                     viewBox="0 0 16 16"
                                     aria-hidden="true">
                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                    <path d="m8.93 6.588-2.29.287-.082.381.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM8 5.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
                                </svg>

                            </div>

                            <div>
                                <h2 class="h5 fw-bold mb-2">
                                    Confirmación
                                </h2>

                                <p class="text-secondary mb-0">
                                    Al continuar podrás crear una o varias tiendas
                                    y administrar su inventario.
                                </p>
                            </div>

                        </div>

                        <!-- Formulario de registro -->
                        <form method="post"
                              th:action="@{/comprador/registrarse-vendedor}">

                            <div class="border-top pt-3">

                                <div class="d-grid d-sm-flex
                                            justify-content-sm-end gap-2">

                                    <a class="btn btn-outline-secondary"
                                       th:href="@{/comprador/perfil}">
                                        Cancelar
                                    </a>

                                    <button class="btn btn-primary px-4"
                                            type="submit">
                                        Confirmar registro como vendedor
                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>
                </article>

            </section>
        </main>

    </div>
</div>

</body>
</html>
