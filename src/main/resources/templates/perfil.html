<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Perfil | DebiCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app-body">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="app-main">
        <section class="page-content container-fluid px-3 px-md-4 px-xl-5 py-3 py-lg-4">
            <div class="page-heading d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div>
                    <h1>Perfil de usuario</h1>
                    <p>Consulta y actualiza tu información personal.</p>
                </div>
            </div>

            <article class="card mb-4" th:if="${session.mensajeVendedor != null}">
                <p th:text="${session.mensajeVendedor}">Mensaje</p>
            </article>

            <article class="card mb-4" th:if="${session.mensajeErrorVendedor != null}">
                <p th:text="${session.mensajeErrorVendedor}">Error</p>
            </article>

            <article class="card mb-4" th:if="${puedeRegistrarseVendedor}">
                <h2>¿Quieres vender en DebiCom?</h2>
                <p>Regístrate como vendedor para administrar una tienda, productos y solicitudes de crédito.</p>
                <form method="post" th:action="@{/comprador/registrarse-vendedor}"
                      onsubmit="return confirm('¿Deseas registrarte como vendedor?');">
                    <button class="button primary" type="submit">Registrarme como vendedor</button>
                </form>
            </article>

            <article class="card mb-4">
                <form class="dark-grid row g-3 d-flex flex-wrap" method="post" th:action="@{/comprador/perfil}">
                    <label class="col-12 col-md-6">Nombre
                        <input name="nombre" th:value="${perfil != null ? perfil.nombre : ''}" required class="form-control">
                    </label>
                    <label class="col-12 col-md-6">Apellido
                        <input name="apellido" th:value="${perfil != null ? perfil.apellido : ''}" required class="form-control">
                    </label>
                    <label class="col-12 col-md-6">Identificación
                        <input name="identificacion" th:value="${perfil != null ? perfil.identificacion : ''}" required class="form-control">
                    </label>
                    <label class="col-12 col-md-6">Tipo de identificación
                        <input th:value="${perfil != null ? perfil.tipoIdentificacion : ''}" readonly class="form-control">
                    </label>
                    <label class="col-12 col-md-6">Fecha de nacimiento
                        <input type="date" name="fechaNacimiento" th:value="${perfil != null and perfil.fechaNacimiento != null ? perfil.fechaNacimiento : ''}" required class="form-control">
                    </label>
                    <label class="col-12 col-md-6">Correo
                        <input type="email" name="correo" th:value="${perfil != null ? perfil.correo : ''}" required class="form-control">
                    </label>
                    <label class="col-12 col-md-6">Teléfono
                        <input name="telefono" th:value="${perfil != null ? perfil.telefono : ''}" required class="form-control">
                    </label>
                    <label class="col-12 col-md-6">Dirección
                        <input name="direccion" th:value="${perfil != null ? perfil.direccion : ''}" required class="form-control">
                    </label>
                    <label class="col-12">
                        <input type="checkbox" name="autorizaDatos"
                               th:checked="${perfil != null and perfil.autorizaDatos != null and perfil.autorizaDatos == 1}" class="form-check-input">
                        Autorizo el tratamiento de mis datos
                    </label>
                    <div class="form-actions d-grid d-sm-flex flex-wrap gap-2 justify-content-sm-end mt-3 col-12">
                        <button class="button primary" type="submit">Guardar cambios</button>
                    </div>
                </form>
            </article>
        </section>
    </main>
</div>
</body>
</html>
